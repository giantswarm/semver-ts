name: CI

# Every commit on main and every release tag gets a run of its own, not only
# the pull request that produced it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

# One run per ref: a superseded pull request run is cancelled, a run on main
# or a tag never is, so every commit there keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      # dist/ is committed so the package installs from git.
      - run: npm run build
      - run: git diff --exit-code -- dist
